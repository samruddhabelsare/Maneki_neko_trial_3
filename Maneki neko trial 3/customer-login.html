<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maneki Neko | Welcome</title>
<meta name="description" content="Scan, select your table, and start ordering with your AI waiter!">
<meta name="theme-color" content="#100d0c">
<link rel="icon" href="./shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./shared/theme.css">
<link rel="stylesheet" href="./shared/icons.css">
<style>
/* ══════════════════════════════════════════════════════════════════════
   Guest login — Kami to Sumi (§7.3)
   Same room as the staff entrance; one washi card carrying a three-seal
   progress rail, a tatami table plan and a shokken meal ticket.
   ══════════════════════════════════════════════════════════════════════ */

/* ── Room ─────────────────────────────────────────────────────────────── */
body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
}
.room-layer,
.enso-halo { position: fixed; }
.enso-halo { width: 560px; height: 560px; }

/* Lantern pools (radial gradients, no filter:blur, slow float) */
.bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.bg-orb-1 {
    width: 600px; height: 600px; top: -240px; right: -200px;
    background: radial-gradient(circle, rgba(214,58,31,.26) 0%, rgba(214,58,31,.08) 40%, transparent 68%);
    animation: float 11s ease-in-out infinite;
}
.bg-orb-2 {
    width: 560px; height: 560px; bottom: -220px; left: -200px;
    background: radial-gradient(circle, var(--lantern-glow) 0%, rgba(255,179,71,.08) 38%, transparent 68%);
    animation: float 9s ease-in-out infinite reverse;
}

/* ── Card (washi) ──────────────────────────────────────────────────────── */
.login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: auto;
    padding: 2rem;
    box-shadow: var(--shadow-2xl);
    animation: fadeInUp 0.6s var(--ease-out) both;
}
.card-ribbon {
    position: absolute;
    top: 1.25rem;
    right: -2.4rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--kin-dim);
    opacity: 0.9;
    pointer-events: none;
    user-select: none;
}
.card-seal {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 34px;
    height: 34px;
    font-size: 1rem;
}

/* ── Brand ─────────────────────────────────────────────────────────────── */
.brand { text-align: center; margin-bottom: 1.25rem; display: grid; justify-items: center; gap: 0.3rem; }
.brand-cat { width: 72px; height: 72px; margin-bottom: 0.1rem; }
/* decorative groups never catch the pointer (the svg is role=img) */
.brand-cat :is(.mn-shadow, .mn-body, .mn-head, .mn-patches, .mn-head-line, .mn-ears,
               .mn-collar, .mn-bell, .mn-koban, .mn-paw-rest, .mn-koban-text) { pointer-events: none; }
.brand-name {
    font-family: var(--font-display);
    font-size: 1.625rem;
    font-weight: 600;
    letter-spacing: var(--tracking-display);
    line-height: 1.15;
    color: var(--sumi-ink);
    margin: 0;
}
.brand .rule-sumi { margin: 0.1rem auto 0.35rem; }
.brand-sub { margin: 0; }

/* ── Progress rail: 一 二 三 seals (theme .step-rail; state via :has) ──── */
.step-rail { margin-bottom: 1.5rem; }
.login-card:has(#step1.active) .rail-1,
.login-card:has(#step2.active) .rail-2,
.login-card:has(#step3.active) .rail-3 { background: var(--shu); color: #fff; border-color: var(--shu-deep); box-shadow: var(--shadow-seal); }
.login-card:has(#step2.active) .rail-1,
.login-card:has(#step3.active) :is(.rail-1, .rail-2) { background: var(--kin); color: var(--sumi-ink); border-color: var(--kin); }

/* ── Steps (display mechanism is the wizard contract) ─────────────────── */
.step { display: none; }
.step.active { display: block; animation: ink-in 0.35s var(--ease-out); }

.step-title {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--font-display);
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: var(--tracking-display);
    color: var(--sumi-ink);
    margin: 0 0 1rem;
}
.step-title .step-num { width: 26px; height: 26px; font-size: 0.875rem; }
.step-title .lbl-jp { margin-left: 0; }   /* kanji hugs its English (the .lbl lockup), never flung to the far edge */

/* ── Form ──────────────────────────────────────────────────────────────── */
.form-group { margin-bottom: 1.1rem; }
.form-label {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.6875rem;
    font-weight: 700;
    color: var(--sumi-ink-2);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.4rem;
}
.form-label .lbl-jp { text-transform: none; letter-spacing: 0.06em; }
.form-input { width: 100%; }

/* ── Greeting ──────────────────────────────────────────────────────────── */
.jp-greet {
    font-family: var(--font-display);
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--shu-ink);
    letter-spacing: 0.08em;
    margin: 0 0 0.15rem;
}
.greet { color: var(--sumi-ink-3); font-size: 0.875rem; margin: 0 0 0.9rem; line-height: 1.5; }

/* ── Table plan: tatami tiles ──────────────────────────────────────────── */
.table-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 0.5rem;
    max-height: min(44vh, 320px);
    overflow-y: auto;
    padding: 2px;
    margin-top: 0.25rem;
    scrollbar-width: thin;
    scrollbar-color: var(--washi-line-strong) transparent;
}
.table-grid > .table-loading { grid-column: 1 / -1; padding: 1.5rem 1rem; }
.table-btn {
    position: relative;
    aspect-ratio: 1;
    min-height: 44px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 0.1rem;
    background: var(--washi-2);
    background-image: repeating-linear-gradient(90deg, rgba(28,24,22,.06) 0 2px, transparent 2px 7px);
    border: 1px solid var(--washi-line);
    border-radius: 3px;
    color: var(--sumi-ink);
    cursor: pointer;
    padding: 0.25rem;
    box-shadow: inset 0 1px 0 rgba(255,250,240,.5), 0 1px 2px rgba(0,0,0,.15);
    transition: background-color var(--duration-fast) var(--ease-out),
                border-color var(--duration-fast) var(--ease-out),
                color var(--duration-fast) var(--ease-out),
                box-shadow var(--duration-fast) var(--ease-out);
}
.table-btn:hover:not(.selected) { background-color: var(--washi-bright); border-color: var(--sumi-ink-3); }
.table-btn:hover:not(.selected) .t-label { color: var(--sumi-ink); }
.table-btn .t-num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1; color: inherit; }
/* ink-2 on washi-2 = 8.87:1 (ink-3 would be 4.44 — fails AA at 11px) */
.table-btn .t-label { font: 500 0.6875rem/1.2 var(--font-jp); color: var(--sumi-ink-2); letter-spacing: 0.04em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-btn .t-label:empty { display: none; }
.table-btn.selected {
    background-color: var(--shu);
    background-image: none;
    color: #fff;
    border-color: var(--shu-deep);
    box-shadow: var(--shadow-seal);
}
.table-btn.selected .t-label { color: #fff; }   /* solid white on shu: 4.68:1 */
.table-btn.selected::after {
    content: none;
    position: absolute;
    top: 3px;
    right: 4px;
    font: 500 0.6875rem/1 var(--font-jp);
    color: #fff;
    letter-spacing: 0.04em;
}
/* Grid states: loading / "No tables found" (JS innerHTML; theme empty-state recipe) */
.table-grid > .table-loading::after { content: none; color: var(--sumi-ink-3); }
.table-grid > .table-loading[style]::after { content: none; }
.table-grid > .table-loading[style]::before { filter: hue-rotate(300deg) saturate(.6); }   /* ensō in ume for the error variant */

/* ── Buttons ───────────────────────────────────────────────────────────── */
.step .btn { margin-top: 0.9rem; }
.step .btn-ghost { margin-top: 0.5rem; }
.step .btn-ghost .ico { width: 16px; height: 16px; }
.step .btn-ghost .jp { color: inherit; opacity: 0.75; }
#step1Btn, #step2Btn, #startOrderingBtn { font-size: 1rem; min-height: 48px; }
#step2Btn.mi-check:disabled::before { display: none; }       /* check glyph only once a table is picked */
/* "Looking up..." — only the lookup disables this button: keep the vermilion seal, show an ensō instead of the arrow */
#step1Btn:disabled {
    background: linear-gradient(170deg, #e0432a, var(--shu) 55%, var(--primary-dim));
    border-color: var(--shu-deep);
    color: #fff;
    cursor: progress;
    opacity: 0.85;
}
#step1Btn.mi-after-arrow:disabled::after {
    content: "";
    width: 18px;
    height: 18px;
    background: transparent;
    -webkit-mask: none;
    mask: none;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-right-color: transparent;
    border-radius: 50%;
    animation: enso-spin 0.9s linear infinite;
}
#startOrderingBtn .ico { width: 20px; height: 20px; }

/* ── Error strip: torn washi, ume ink (JS toggles inline display) ──────── */
.error-msg {
    display: none;
    position: relative;
    background: var(--washi-bright);
    border-left: 3px solid var(--ume-ink);
    border-radius: 0 3px 3px 0;
    box-shadow: var(--shadow-soft);
    color: var(--ume-ink);
    padding: 0.65rem 0.9rem;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.4;
    margin: 0 0 1rem;
    animation: shakeX 0.4s var(--ease-out);
}
.error-msg.mi-warning::before { margin-right: 0.5em; }
.error-msg::after {
    content: "";
    position: absolute;
    top: -6px; left: 0; right: 0; height: 7px;
    background: var(--washi-bright);
    -webkit-mask: var(--deckle) 0 0 / 18px 7px repeat-x;
    mask: var(--deckle) 0 0 / 18px 7px repeat-x;
    pointer-events: none;
}
@keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    40%       { transform: translateX(8px); }
    60%       { transform: translateX(-5px); }
    80%       { transform: translateX(5px); }
}

/* ── Step 3: shokken meal ticket ───────────────────────────────────────── */
#step3 { position: relative; }
#step3 .sakura-drift { z-index: 0; top: 2.5rem; }      /* petals fall through the ticket zone, not the heading */
#step3 .sakura-drift > * { opacity: 0.5; }
#step3 > :not(.sakura-drift) { position: relative; z-index: 1; }
.summary-card {
    padding: 1.1rem 1.2rem 1rem;
    margin: 0 0 1rem;
    background-color: var(--washi-bright);
    /* .ticket holes read as paper dimples on a paper card */
    background-image:
        radial-gradient(circle at 14px 10px, var(--washi-2) 4px, transparent 4.5px),
        radial-gradient(circle at calc(100% - 14px) 10px, var(--washi-2) 4px, transparent 4.5px),
        var(--washi-fibre),
        linear-gradient(180deg, var(--washi-bright), var(--washi) 60%, var(--washi-2));
}
.summary-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-bottom: 0.6rem;
    margin-bottom: 0.6rem;
    border-bottom: 2px dashed var(--washi-line);
}
.summary-head .eyebrow { margin: 0; }
.summary-head .confirm-seal { margin-left: auto; width: 44px; height: 44px; font-size: 0.875rem; letter-spacing: 0.04em; }
.summary-row { display: flex; align-items: baseline; gap: 0.4rem; font-size: 0.9rem; }
.summary-row + .summary-row { margin-top: 0.55rem; }
.summary-label { display: flex; align-items: baseline; flex: 1; color: var(--sumi-ink-3); font-size: 0.8125rem; font-weight: 500; }
.summary-label .jp { margin-left: 0.35rem; }
.summary-label::after { content: ""; flex: 1; min-width: 1.25rem; border-bottom: 1px dotted var(--washi-line-strong); margin: 0 0.4rem 0.3em; }
.summary-value { flex: 0 1 auto; min-width: 0; max-width: 62%; font-family: var(--font-display); font-size: 1rem; font-weight: 600; line-height: 1.25; color: var(--sumi-ink); text-align: right; text-wrap: balance; }

/* ── Footer (inside the card) ──────────────────────────────────────────── */
.login-footer { text-align: center; margin-top: 1.25rem; padding-top: 0.9rem; border-top: 2px dashed var(--washi-line); }
.back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    min-height: 44px; padding: 0 0.75rem;
    font-size: 0.8125rem; font-weight: 600;
    color: var(--sumi-ink-3); text-decoration: none; border-radius: 3px;
    transition: color var(--duration-fast) var(--ease-out);
}
.back-link .ico { width: 16px; height: 16px; }
.back-link .jp { color: inherit; font-size: 0.75rem; }
.back-link:hover { color: var(--shu-ink); }

/* ── Small screens ─────────────────────────────────────────────────────── */
@media (max-width: 480px) {
    body { padding: 1rem; }
    .login-card { padding: 1.5rem 1.25rem; }
    .card-ribbon { display: none; }
    .card-seal { top: 0.75rem; right: 0.75rem; width: 30px; height: 30px; font-size: 0.875rem; }
}
@media (max-width: 400px) {
    .brand-sub .brand-sub-jp { display: none; }   /* the cat and the Mincho title already say 招き猫 */
    .summary-value { font-size: 0.9375rem; max-width: 70%; }
}
</style>
</head>
<body>

<div class="room-layer" aria-hidden="true"></div>
<div class="bg-orb bg-orb-1" aria-hidden="true"></div>
<div class="bg-orb bg-orb-2" aria-hidden="true"></div>
<div class="enso-halo" aria-hidden="true"></div>

<div class="login-card paper">

    
    <span class="hanko card-seal" aria-hidden="true">M</span>

    <div class="brand">
        <!-- Guest variant: the raised paw beckons customers in -->
        <svg class="mn mn--washi brand-cat" viewBox="0 0 120 120" width="72" height="72" role="img" aria-label="Maneki-neko, the beckoning lucky cat"><g class="mn-shadow"><ellipse cx="60" cy="111" rx="34" ry="4.5" fill="rgba(0,0,0,.28)"/></g><g class="mn-body" fill="#f3ebdd" stroke="#1c1816" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M31 103c-8 0-12-5-10-11" fill="none" stroke-width="9.5"/>

            <path d="M37 27 42 13l10 12z"/><path d="M83 27 78 13 68 25z"/>
            <circle cx="60" cy="46" r="27"/>
          </g><g class="mn-patches" stroke="none">
            <path d="M66 22c6-4 12-2 15 7-2 6-5 10-9 11-5-2-8-7-6-18z" fill="#c8923e"/>
            <path d="M83 79c-7 4-13 12-13 19 4 4 11 4 16 2 2-7 1-14-3-21z" fill="#3a332e"/>
            <path d="M77 17l-6.5 7.5" fill="none" stroke="#c8923e" stroke-width="7" stroke-linecap="round"/>
          </g>
          <g class="mn-head-line" fill="none" stroke="#1c1816" stroke-width="1.5"><circle cx="60" cy="46" r="27"/><path d="M83 27 78 13 68 25z"/></g><g class="mn-ears" fill="#f3b9c8" stroke="none"><path d="M41 25 43.5 18l6 7z"/><path d="M79 25l-2.5-7-6 7z"/></g><g class="mn-face" fill="none" stroke="#1c1816" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="42" cy="55" r="3.4" fill="#f3b9c8" stroke="none" opacity=".75"/><circle cx="78" cy="55" r="3.4" fill="#f3b9c8" stroke="none" opacity=".75"/>
            <path d="M47 47q5-5 10 0M63 47q5-5 10 0" fill="none" stroke="#1c1816" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M57.8 52.2h4.4L60 55.2z" fill="#d63a1f" stroke="#d63a1f" stroke-width="1" stroke-linejoin="round"/>
            <path d="M54 57q3 3.5 6 0q3 3.5 6 0" stroke-width="1.6"/>

            <circle cx="60" cy="82" r="5.5"/><path d="M57 83h6M60 83v2.4" fill="none" stroke-linecap="round" stroke="#a8832f"/>
          </g><g class="mn-koban" fill="#e3b55a" stroke="#a8832f" stroke-width="1.2">
            <ellipse cx="44" cy="97" rx="13" ry="9"/><ellipse cx="44" cy="97" rx="9" ry="5" fill="none"/>
          </g><g class="mn-paw-rest" fill="#f3ebdd" stroke="#1c1816" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M36 76c-5 4-5 10-1 14" fill="none" stroke-width="11"/>
            <path d="M36 76c-5 4-5 10-1 14" fill="none" stroke="#f3ebdd" stroke-width="8"/>
            <ellipse cx="38" cy="89.5" rx="6.5" ry="4.5"/>
          </g><g class="mn-paw" style="transform-origin:82px 66px;transform-box:view-box" fill="#f3ebdd" stroke="#1c1816" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M83 72c12 0 17-12 13-34" fill="none" stroke-width="9.5"/>
            <path d="M83 72c12 0 17-12 13-34" fill="none" stroke="#f3ebdd" stroke-width="6.5"/>
            <circle cx="95" cy="33" r="7.5"/>
            <g fill="#f3b9c8" stroke="none"><ellipse cx="91" cy="30.5" rx="1.6" ry="1.9"/><ellipse cx="95" cy="28.6" rx="1.6" ry="1.9"/><ellipse cx="99" cy="30.5" rx="1.6" ry="1.9"/><ellipse cx="95" cy="35" rx="3.4" ry="2.6"/></g>
          </g></svg>

        <h1 class="brand-name">Maneki Neko</h1>
        <span class="rule-sumi" aria-hidden="true"></span>
        <p class="brand-sub eyebrow">Smart Restaurant · AI Ordering</p>

    <!-- Progress rail: 一 二 三 -->
    <div class="step-rail" aria-hidden="true">
        <span class="rail-1">1</span>
        <span class="rail-2">2</span>
        <span class="rail-3">3</span>
    </div>

    <!-- Error strip (shared across steps; JS toggles inline display) -->
    <div class="error-msg mi-warning" id="errorMsg" role="alert"></div>

    <!-- ── Step 1: Restaurant Code ─────────────────────── -->
    <div class="step active" id="step1">
        <h2 class="step-title"><span class="step-num hanko hanko--sm" aria-hidden="true">1</span>Enter Restaurant Code</h2>

            <label class="form-label lbl" for="restaurantCodeInput"><span class="lbl-en">Restaurant Code</span></label>
            <div class="input-wrap is-code">
                <svg class="ico input-icon" aria-hidden="true"><use href="./shared/icons.svg#i-lantern"/></svg>
                <input type="text" id="restaurantCodeInput" class="form-input code"
                    placeholder="TOKYO"
                    autocomplete="off" autocapitalize="characters" maxlength="20">
            </div>
        </div>
        <button class="btn btn-primary btn-seal btn-block mi-after-arrow" id="step1Btn">Next</button>
    </div>

    <!-- ── Step 2: Table Selection ────────────────────── -->
    <div class="step" id="step2">
        <h2 class="step-title"><span class="step-num hanko hanko--sm" aria-hidden="true">2</span>Select Your Table</h2>
        
        <p id="restaurantGreeting" class="greet"></p>
        <div class="table-grid" id="tableGrid">
            <div class="table-loading">Loading tables...</div>
        </div>
        <button class="btn btn-primary btn-seal btn-block mi-check" id="step2Btn" disabled>Select a table above</button>
        <button class="btn btn-ghost btn-block" id="backBtn"><svg class="ico" aria-hidden="true"><use href="./shared/icons.svg#i-arrow-left"/></svg>Back </button>
    </div>

    <!-- ── Step 3: Confirm ────────────────────────────── -->
    <div class="step" id="step3">
        <div class="sakura-drift" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h2 class="step-title"><span class="step-num hanko hanko--sm" aria-hidden="true">3</span>You're all set!</h2>
        <div class="summary-card paper ticket">
            <div class="summary-head">
                <p class="eyebrow">Meal ticket</p>
                <span class="hanko confirm-seal stamp-in" aria-hidden="true">OK</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Restaurant</span>
                <span class="summary-value" id="confirmRestaurant">—</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Code</span>
                <span class="summary-value"><span class="code-pill" id="confirmCode">—</span></span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Your Table</span>
                <span class="summary-value" id="confirmTable">—</span>
            </div>
        </div>
        <button class="btn btn-primary btn-seal btn-block" id="startOrderingBtn"><svg class="ico" aria-hidden="true"><use href="./shared/icons.svg#i-tray"/></svg>Start Ordering </button>
        <button class="btn btn-ghost btn-block" id="back2Btn"><svg class="ico" aria-hidden="true"><use href="./shared/icons.svg#i-arrow-left"/></svg>Change Table </button>
    </div>

    <div class="login-footer">
        <a href="./index.html" class="back-link"><svg class="ico" aria-hidden="true"><use href="./shared/icons.svg#i-arrow-left"/></svg>Home </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared/supabase.js"></script>
<script src="./shared/customer-auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

    // ── State ────────────────────────────────────────────────────────────────
    let restaurant   = null; // { id, name, code }
    let selectedTable = null; // { table_number, label }

    // ── DOM ──────────────────────────────────────────────────────────────────
    const codeInput   = document.getElementById('restaurantCodeInput');
    const errorMsg    = document.getElementById('errorMsg');

    // ── If already has a valid session, skip to ordering ────────────────────
    const existing = window.CustomerAuth.getSession();
    if (existing) {
        goToOrdering(existing);
        return;
    }

    // ── Auto-uppercase code ──────────────────────────────────────────────────
    codeInput.addEventListener('input', () => {
        const p = codeInput.selectionStart;
        codeInput.value = codeInput.value.toUpperCase();
        codeInput.setSelectionRange(p, p);
    });
    codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('step1Btn').click(); });
    codeInput.focus();

    // ── Error helpers ─────────────────────────────────────────────────────────
    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }
    function hideError() { errorMsg.style.display = 'none'; }

    // ── Step navigation ───────────────────────────────────────────────────────
    function showStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        hideError();
    }

    // ── Step 1: Validate restaurant code ──────────────────────────────────────
    document.getElementById('step1Btn').addEventListener('click', async () => {
        const code = codeInput.value.trim().toUpperCase();
        if (!code) { showError('Please enter a restaurant code.'); return; }

        const btn = document.getElementById('step1Btn');
        btn.disabled = true;
        btn.textContent = 'Looking up...';

        const { data, error } = await window.supabaseClient
            .from('restaurants')
            .select('id, name, code')
            .eq('code', code)
            .maybeSingle();

        btn.disabled = false;
        btn.textContent = 'Next';

        if (error) { showError('Service error. Please try again.'); return; }
        if (!data)  { showError(`Restaurant code "${code}" not found. Please check with your host.`); return; }

        restaurant = data;
        document.getElementById('restaurantGreeting').textContent =
            `Welcome to ${restaurant.name}! Please select your table number:`;

        await loadTables(restaurant.id);
        showStep(2);
    });

    // ── Load tables for restaurant ────────────────────────────────────────────
    async function loadTables(restaurantId) {
        const grid = document.getElementById('tableGrid');
        grid.innerHTML = '<div class="table-loading">Loading tables...</div>';

        const { data, error } = await window.supabaseClient
            .from('restaurant_tables')
            .select('table_number, label, is_active')
            .eq('restaurant_id', restaurantId)
            .eq('is_active', true)
            .order('table_number');

        if (error || !data || data.length === 0) {
            grid.innerHTML = '<div class="table-loading" style="color:var(--danger)">No tables found. Please ask staff for help.</div>';
            return;
        }

        grid.innerHTML = '';
        data.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'table-btn';
            btn.dataset.num = t.table_number;
            btn.dataset.label = t.label || ('Table ' + t.table_number);
            btn.innerHTML = `<span class="t-num">${t.table_number}</span><span class="t-label">${t.label || ''}</span>`;
            btn.addEventListener('click', () => selectTable(btn, t));
            grid.appendChild(btn);
        });
    }

    // ── Select table ──────────────────────────────────────────────────────────
    function selectTable(btn, tableData) {
        document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTable = tableData;

        const step2Btn = document.getElementById('step2Btn');
        step2Btn.disabled = false;
        step2Btn.textContent = `Confirm Table ${tableData.table_number}`;
    }

    // ── Step 2 → Step 3 ───────────────────────────────────────────────────────
    document.getElementById('step2Btn').addEventListener('click', () => {
        if (!selectedTable) return;
        document.getElementById('confirmRestaurant').textContent = restaurant.name;
        document.getElementById('confirmCode').textContent = restaurant.code;
        document.getElementById('confirmTable').textContent =
            selectedTable.label || ('Table ' + selectedTable.table_number);
        showStep(3);
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        selectedTable = null;
        showStep(1);
    });

    document.getElementById('back2Btn').addEventListener('click', () => showStep(2));

    // ── Step 3: Start Ordering ────────────────────────────────────────────────
    document.getElementById('startOrderingBtn').addEventListener('click', () => {
        if (!restaurant || !selectedTable) return;

        window.CustomerAuth.startSession(
            restaurant.id,
            restaurant.name,
            restaurant.code,
            selectedTable.table_number,
            selectedTable.label || ('Table ' + selectedTable.table_number)
        );

        goToOrdering({ tableNumber: selectedTable.table_number });
    });

    function goToOrdering(session) {
        const table = session.tableNumber || 1;
        // Preserve any existing query params (bot, character, etc.)
        const params = new URLSearchParams(window.location.search);
        params.set('table', table);
        window.location.href = './customer/index.html?' + params.toString();
    }
});
</script>
</body>
</html>
