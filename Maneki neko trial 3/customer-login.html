<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maneki Neko | Welcome</title>
<meta name="description" content="Scan, select your table, and start ordering with your AI waiter!">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/theme.css">
<style>
body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; overflow:hidden; position:relative; }

/* Animated orbs */
.bg-orb { position:fixed; border-radius:50%; pointer-events:none; filter:blur(80px); opacity:0.15; z-index:0; }
.bg-orb-1 { width:500px; height:500px; background:radial-gradient(circle, #6366f1, transparent); top:-120px; right:-120px; animation:orbFloat 12s ease-in-out infinite; }
.bg-orb-2 { width:400px; height:400px; background:radial-gradient(circle, #ec4899, transparent); bottom:-100px; left:-100px; animation:orbFloat 16s ease-in-out infinite reverse; }
@keyframes orbFloat { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(30px,-20px) scale(1.05); } }

/* Card */
.login-card {
    position:relative; z-index:1;
    background:var(--glass-bg); backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border); border-radius:var(--radius-2xl);
    padding:2.5rem 2rem; width:100%; max-width:420px;
    box-shadow:var(--shadow-2xl);
    animation:cardIn .4s var(--ease-out) both;
}
@keyframes cardIn { from { opacity:0; transform:translateY(24px) scale(.97); } to { opacity:1; transform:none; } }

.brand { text-align:center; margin-bottom:2rem; }
.brand-cat { font-size:3.5rem; display:block; margin-bottom:.5rem; animation:catBob 2s ease-in-out infinite; }
@keyframes catBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
.brand-name { font-size:1.75rem; font-weight:800; letter-spacing:-.02em; background:linear-gradient(135deg,var(--primary),#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.brand-sub { color:var(--text-muted); font-size:.875rem; margin-top:.25rem; }

/* Steps */
.step { display:none; animation:fadeIn .25s var(--ease-out); }
.step.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

.step-title { font-size:1.1rem; font-weight:700; margin-bottom:1.25rem; display:flex; align-items:center; gap:.5rem; }
.step-num { display:inline-flex; align-items:center; justify-content:center; width:1.75rem; height:1.75rem; background:var(--primary-glow); color:var(--primary); border-radius:50%; font-size:.75rem; font-weight:800; border:1px solid rgba(99,102,241,.25); flex-shrink:0; }

.form-group { margin-bottom:1.1rem; }
.form-label { display:block; font-size:.75rem; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.4rem; }
.input-wrap { position:relative; }
.input-icon { position:absolute; left:.9rem; top:50%; transform:translateY(-50%); font-size:1.1rem; pointer-events:none; }
.form-input { width:100%; background:var(--bg-surface-variant); border:1px solid var(--border); color:var(--text-primary); border-radius:var(--radius-md); padding:.8rem .9rem .8rem 2.75rem; font-family:var(--font-sans); font-size:.95rem; outline:none; transition:border-color .15s,box-shadow .15s; box-sizing:border-box; }
.form-input:focus { border-color:rgba(99,102,241,.5); box-shadow:0 0 0 3px var(--primary-glow); }

/* Table grid */
.table-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; margin-top:.5rem; max-height:260px; overflow-y:auto; padding-right:.25rem; }
.table-btn { aspect-ratio:1; background:var(--bg-surface-variant); border:2px solid var(--border); border-radius:var(--radius-md); font-weight:700; font-size:.9rem; color:var(--text-secondary); cursor:pointer; transition:all .15s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; }
.table-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-glow); }
.table-btn.selected { border-color:var(--primary); background:var(--primary-glow); color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
.table-btn .t-num { font-size:1.1rem; line-height:1; }
.table-btn .t-label { font-size:.6rem; color:var(--text-dimmed); font-weight:500; }
.table-loading { text-align:center; color:var(--text-dimmed); padding:1.5rem; font-size:.875rem; }

/* Buttons */
.btn { width:100%; padding:.8rem 1.25rem; border-radius:var(--radius-md); font-weight:700; font-size:.95rem; cursor:pointer; border:none; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:.5rem; margin-top:.75rem; }
.btn-primary { background:linear-gradient(135deg,var(--primary-raw),var(--primary-dim)); color:#fff; }
.btn-primary:hover:not(:disabled) { box-shadow:var(--shadow-glow); transform:translateY(-1px); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:var(--text-secondary); }
.btn-ghost:hover { background:var(--bg-surface-variant); }

/* Error */
.error-msg { background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-border); border-radius:var(--radius-md); padding:.65rem .9rem; font-size:.85rem; font-weight:600; margin-bottom:.9rem; display:none; }

/* Selected summary */
.summary-card { background:var(--bg-surface-variant); border:1px solid var(--border); border-radius:var(--radius-md); padding:1rem 1.1rem; margin-bottom:1rem; }
.summary-row { display:flex; justify-content:space-between; align-items:center; font-size:.875rem; }
.summary-row + .summary-row { margin-top:.5rem; border-top:1px solid var(--border); padding-top:.5rem; }
.summary-label { color:var(--text-muted); }
.summary-value { font-weight:700; }
.code-pill { background:var(--primary-glow); color:var(--primary); border:1px solid rgba(99,102,241,.2); border-radius:.4rem; padding:.1rem .45rem; font-family:var(--font-mono); font-size:.8rem; font-weight:700; letter-spacing:.06em; }

/* Footer */
.page-footer { text-align:center; margin-top:1.25rem; font-size:.8rem; color:var(--text-dimmed); }
.page-footer a { color:var(--text-muted); text-decoration:none; }
.page-footer a:hover { color:var(--primary); }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="login-card">

    <div class="brand">
        <span class="brand-cat">🐱</span>
        <div class="brand-name">Maneki Neko</div>
        <div class="brand-sub">Smart Restaurant · AI Ordering</div>
    </div>

    <!-- Error banner (shared across steps) -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- ── Step 1: Restaurant Code ─────────────────────── -->
    <div class="step active" id="step1">
        <div class="step-title"><span class="step-num">1</span> Enter Restaurant Code</div>
        <div class="form-group">
            <label class="form-label">Restaurant Code</label>
            <div class="input-wrap">
                <span class="input-icon">🏮</span>
                <input type="text" id="restaurantCodeInput" class="form-input"
                    placeholder="e.g. TOKYO"
                    autocomplete="off" autocapitalize="characters" maxlength="20"
                    style="text-transform:uppercase;letter-spacing:.1em;font-weight:700;">
            </div>
        </div>
        <button class="btn btn-primary" id="step1Btn">Next →</button>
    </div>

    <!-- ── Step 2: Table Selection ────────────────────── -->
    <div class="step" id="step2">
        <div class="step-title"><span class="step-num">2</span> Select Your Table</div>
        <p id="restaurantGreeting" style="color:var(--text-muted);font-size:.875rem;margin-bottom:1rem;"></p>
        <div class="table-grid" id="tableGrid">
            <div class="table-loading">Loading tables...</div>
        </div>
        <button class="btn btn-primary" id="step2Btn" disabled>Select a table above</button>
        <button class="btn btn-ghost" id="backBtn" style="margin-top:.4rem;">← Back</button>
    </div>

    <!-- ── Step 3: Confirm ────────────────────────────── -->
    <div class="step" id="step3">
        <div class="step-title"><span class="step-num">3</span> You're all set!</div>
        <div class="summary-card">
            <div class="summary-row">
                <span class="summary-label">Restaurant</span>
                <span class="summary-value" id="confirmRestaurant">—</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Code</span>
                <span class="summary-value"><span class="code-pill" id="confirmCode">—</span></span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Your Table</span>
                <span class="summary-value" id="confirmTable">—</span>
            </div>
        </div>
        <button class="btn btn-primary" id="startOrderingBtn">🍱 Start Ordering</button>
        <button class="btn btn-ghost" id="back2Btn" style="margin-top:.4rem;">← Change Table</button>
    </div>

</div>

<div class="page-footer">
    <a href="./index.html">← Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared/supabase.js"></script>
<script src="./shared/customer-auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

    // ── State ────────────────────────────────────────────────────────────────
    let restaurant   = null; // { id, name, code }
    let selectedTable = null; // { table_number, label }

    // ── DOM ──────────────────────────────────────────────────────────────────
    const codeInput   = document.getElementById('restaurantCodeInput');
    const errorMsg    = document.getElementById('errorMsg');

    // ── If already has a valid session, skip to ordering ────────────────────
    const existing = window.CustomerAuth.getSession();
    if (existing) {
        goToOrdering(existing);
        return;
    }

    // ── Auto-uppercase code ──────────────────────────────────────────────────
    codeInput.addEventListener('input', () => {
        const p = codeInput.selectionStart;
        codeInput.value = codeInput.value.toUpperCase();
        codeInput.setSelectionRange(p, p);
    });
    codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('step1Btn').click(); });
    codeInput.focus();

    // ── Error helpers ─────────────────────────────────────────────────────────
    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }
    function hideError() { errorMsg.style.display = 'none'; }

    // ── Step navigation ───────────────────────────────────────────────────────
    function showStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        hideError();
    }

    // ── Step 1: Validate restaurant code ──────────────────────────────────────
    document.getElementById('step1Btn').addEventListener('click', async () => {
        const code = codeInput.value.trim().toUpperCase();
        if (!code) { showError('Please enter a restaurant code.'); return; }

        const btn = document.getElementById('step1Btn');
        btn.disabled = true;
        btn.textContent = 'Looking up...';

        const { data, error } = await window.supabaseClient
            .from('restaurants')
            .select('id, name, code')
            .eq('code', code)
            .maybeSingle();

        btn.disabled = false;
        btn.textContent = 'Next →';

        if (error) { showError('Service error. Please try again.'); return; }
        if (!data)  { showError(`Restaurant code "${code}" not found. Please check with your host.`); return; }

        restaurant = data;
        document.getElementById('restaurantGreeting').textContent =
            `Welcome to ${restaurant.name}! Please select your table number:`;

        await loadTables(restaurant.id);
        showStep(2);
    });

    // ── Load tables for restaurant ────────────────────────────────────────────
    async function loadTables(restaurantId) {
        const grid = document.getElementById('tableGrid');
        grid.innerHTML = '<div class="table-loading">Loading tables...</div>';

        const { data, error } = await window.supabaseClient
            .from('restaurant_tables')
            .select('table_number, label, is_active')
            .eq('restaurant_id', restaurantId)
            .eq('is_active', true)
            .order('table_number');

        if (error || !data || data.length === 0) {
            grid.innerHTML = '<div class="table-loading" style="color:var(--danger)">No tables found. Please ask staff for help.</div>';
            return;
        }

        grid.innerHTML = '';
        data.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'table-btn';
            btn.dataset.num = t.table_number;
            btn.dataset.label = t.label || ('Table ' + t.table_number);
            btn.innerHTML = `<span class="t-num">${t.table_number}</span><span class="t-label">${t.label || ''}</span>`;
            btn.addEventListener('click', () => selectTable(btn, t));
            grid.appendChild(btn);
        });
    }

    // ── Select table ──────────────────────────────────────────────────────────
    function selectTable(btn, tableData) {
        document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTable = tableData;

        const step2Btn = document.getElementById('step2Btn');
        step2Btn.disabled = false;
        step2Btn.textContent = `✓ Confirm Table ${tableData.table_number}`;
    }

    // ── Step 2 → Step 3 ───────────────────────────────────────────────────────
    document.getElementById('step2Btn').addEventListener('click', () => {
        if (!selectedTable) return;
        document.getElementById('confirmRestaurant').textContent = restaurant.name;
        document.getElementById('confirmCode').textContent = restaurant.code;
        document.getElementById('confirmTable').textContent =
            selectedTable.label || ('Table ' + selectedTable.table_number);
        showStep(3);
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        selectedTable = null;
        showStep(1);
    });

    document.getElementById('back2Btn').addEventListener('click', () => showStep(2));

    // ── Step 3: Start Ordering ────────────────────────────────────────────────
    document.getElementById('startOrderingBtn').addEventListener('click', () => {
        if (!restaurant || !selectedTable) return;

        window.CustomerAuth.startSession(
            restaurant.id,
            restaurant.name,
            restaurant.code,
            selectedTable.table_number,
            selectedTable.label || ('Table ' + selectedTable.table_number)
        );

        goToOrdering({ tableNumber: selectedTable.table_number });
    });

    function goToOrdering(session) {
        const table = session.tableNumber || 1;
        // Preserve any existing query params (bot, character, etc.)
        const params = new URLSearchParams(window.location.search);
        params.set('table', table);
        window.location.href = './customer/index.html?' + params.toString();
    }
});
</script>
</body>
</html>
